schema_version: "1.0.0"

project:
  name: browser-plugins
  repository: https://github.com/escience-tmsr/browser-plugins
  license: Apache-2.0
  content_type: software

ai_usage:
  used: true
  level: moderate
  summary: >-
    An autonomous coding agent (Claude Code) implemented the progress-recorder
    and HTML-table-renderer module for the default browser extension's planned
    live progress/status view, plus its unit test suite, following a
    design plan (docs/visualize_progress_plan.md) that the agent wrote in
    cooperation with the maintainer, and adapted
    from the row-grain design sketched there and the doi_downloader Python
    project's progress.py as a reference implementation. It also implemented
    the status tab that displays that table and a running status log
    (status-view.html, src/status-view.js, their tests, and the popup,
    manifest and background hooks that open and feed it), the recording
    calls for the capture and download stages in the background, and the
    recording of the page-load and link-search stages reported by the
    content script, and the final polish: opening the status tab
    automatically when a DOI is processed, closing the popup, and the README
    documentation of the status tab. All output is
    intended for human review before merge.

  tools:
    - name: Claude Code
      vendor: Anthropic
      type: agent
      model: claude-sonnet-5
      hosting: cloud_vendor
      trains_on_data: false
      period: { start: "2026-09-17", end: "2026-09-17" }
      purpose: [code generation, test writing]
    - name: Claude Code
      vendor: Anthropic
      type: agent
      model: claude-opus-5-5
      hosting: cloud_vendor
      trains_on_data: false
      period: { start: "2026-09-25", end: "2026-10-06" }
      purpose: [code revision, code generation, test writing, documentation]
    - name: rseng-agent-skills
      type: standalone
      version: "0.1.0"
      skills_consulted: [rseng-quality-framework, rseng-ai-declaration, rseng-testing]

  activities: [code_generation, testing, documentation]

  scope:
    code_generation: true
    code_review: false
    documentation: true
    testing: true
    infrastructure: false

  code_proportion:
    ai_generated_percent: 100
    ai_assisted_percent: 0
    human_only_percent: 0
    method: self_reported
    estimation_notes: >-
      Applies only to the two new files this session added
      (default/src/progress.js, default/tests/progress.test.js) and the
      one-line devDependency fix in default/package.json, and to the
      review-driven revisions of those files and of
      docs/visualize_progress_plan.md, and to the status tab files
      (default/status-view.html, default/src/status-view.js,
      default/tests/status-view.test.js) and the small hooks added to
      default/manifest.json, default/background.js, default/popup.html and
      default/popup.js, and the step 4 recording changes to
      default/background.js, default/src/background.functions.js,
      default/src/progress.js and default/tests/background.test.js, and the
      step 5 recording changes to default/background.js,
      default/src/background.functions.js, default/src/content.functions.js,
      default/tests/background.test.js and default/tests/content.test.js, and
      the step 6 changes to default/manifest.json, default/background.js,
      default/src/background.functions.js, default/src/progress.js,
      default/src/content.functions.js, default/src/status.js,
      default/popup.js,
      default/status-view.html, default/src/status-view.js,
      default/tests/background.test.js, default/tests/status-view.test.js,
      default/tests/progress.test.js and default/README.md; not the whole
      repo.

  components:
    - name: progress recorder/renderer (default/src/progress.js)
      description: >-
        Per-(doi, page) progress-tracking recorder and HTML table renderer for
        the extension's planned status tab; row grain is one row per page
        visited within a job, keyed by `${doi}#${pageCounter}`.
      ai_involvement: >-
        Generated by the agent on 2026-09-17 from the maintainer's written
        plan (docs/visualize_progress_plan.md, section 7 sketch) and adapted
        from doi_downloader/progress.py (../doi-downloader,
        visualize_progress branch) as a structural reference. Revised by the
        agent on 2026-09-25 to address the maintainer's review of PR #7
        (column names, argument and function renames).
      tools_used: [Claude Code]
      notes: human-reviewed by the maintainer in PR #7.
    - name: progress recorder tests (default/tests/progress.test.js)
      description: unit tests for the recorder/renderer module above.
      ai_involvement: >-
        Agent-written alongside the module on 2026-09-17, run locally with
        `npm test` (70/70 passing including the pre-existing suites).
        Revised by the agent on 2026-09-25 to address the maintainer's review
        of PR #7 (test values moved into named constants).
      tools_used: [Claude Code]
      notes: human-reviewed by the maintainer in PR #7.
    - name: status tab (default/status-view.html, default/src/status-view.js)
      description: >-
        Dedicated extension tab showing the progress table and a running log
        of status messages, an "Open status table" popup button, and a
        background `get-progress` handler that returns the current table.
      ai_involvement: >-
        Generated by the agent on 2026-09-25 from plan step 3
        (docs/visualize_progress_plan.md section 8), with table styling
        copied from doi_downloader/progress.py. Tested by the agent with
        `npm test` (83/83 passing) and manually in Firefox by the maintainer.
      tools_used: [Claude Code]
      notes: pending maintainer review before merge.
    - name: status tab tests (default/tests/status-view.test.js)
      description: unit tests for the status tab module above.
      ai_involvement: >-
        Agent-written alongside the module on 2026-09-25. Revised by the
        agent on 2026-09-26 to address the maintainer's review of PR #8
        (bare values replaced by named constants or values derived from them).
      tools_used: [Claude Code]
      notes: human-reviewed by the maintainer in PR #8.
    - name: capture/download recording (default/background.js, default/src/background.functions.js)
      description: >-
        Recording calls for the capture and download stages of the progress
        table, per-job page counting, and pushing the updated table to the
        status tab; also cancels a superseded capture's timeout.
      ai_involvement: >-
        Generated by the agent on 2026-09-26 from plan step 4
        (docs/visualize_progress_plan.md section 8); the page-numbering
        approach was chosen by the maintainer from options the agent
        proposed. Tested by the agent with `npm test` (99/99 passing, tests
        added to default/tests/background.test.js) and manually in Firefox by
        the maintainer. Revised by the agent on 2026-09-26 to address the
        maintainer's review of PR #9 (test values moved into constants, the
        previous session passed explicitly to recordCapture).
      tools_used: [Claude Code]
      notes: human-reviewed by the maintainer in PR #9.
    - name: page-load/link-search recording (default/src/content.functions.js, default/src/background.functions.js)
      description: >-
        Content-script reports of page loads and link searches (new
        record-progress message), recorded by the background on the current
        page's row; a placeholder row for the DOI page seeded by startJob,
        marked failed if the page is not confirmed within a timeout.
      ai_involvement: >-
        Generated by the agent on 2026-09-26 from plan step 5
        (docs/visualize_progress_plan.md section 8) and the placeholder-row
        design in section 3. Tested by the agent with `npm test` (117/117
        passing, tests added to default/tests/background.test.js and
        default/tests/content.test.js) and manually in Firefox by the
        maintainer. Revised by the agent on 2026-09-27 to address the
        maintainer's review of PR #10 (shared DOI test constants, a note on
        buttons that open the PDF in a new tab).
      tools_used: [Claude Code]
      notes: human-reviewed by the maintainer in PR #10.
    - name: status tab polish and documentation (default/src/background.functions.js, default/popup.js, default/status-view.html, default/src/status-view.js, default/README.md)
      description: >-
        startJob opens or focuses the status tab and opens the DOI page in a
        background tab; the popup closes itself after starting a job or
        opening the status tab; the status tab is split into two halves that
        follow their newest entries, with row/line counts, a scroll shadow
        and a "new entries" button; cancelled or broken-off PDF downloads are
        recorded as failed and end the capture; the placeholder row shows a
        new PENDING status instead of SKIPPED; module.exports is only set
        when `module` exists, so the browser no longer stops the shared
        scripts with a ReferenceError; README sections on the status tab, known limitations and running the tests, and corrected
        install steps.
      ai_involvement: >-
        Generated by the agent on 2026-09-27 from plan step 6
        (docs/visualize_progress_plan.md section 8); closing the popup and
        the split status tab were requested by the maintainer during
        testing, with the scroll-following approach and the indicators chosen
        by the maintainer from options the agent proposed, and the
        install-step fixes were proposed by the agent and approved by the
        maintainer. The handling of cancelled downloads was requested by the
        maintainer after testing on a slow connection, and corrected twice
        after the maintainer's Firefox tests. The PENDING status for the
        placeholder row was requested by the maintainer, who found SKIPPED
        confusing while a page loads. The module.exports guards were proposed
        by the agent when the maintainer asked how background.js finds
        functions from other files, and approved by the maintainer. Tested by
        the agent with `npm test` (148/148 passing) and manually in Firefox
        by the maintainer; the guards were only tested with `npm test`.
        Revised by the agent on 2026-09-28 to address the maintainer's review
        of PR #11 (README wording, a leftover sentence about already
        downloaded PDFs removed, the new-entries-button class name).
        Revised by the agent on 2026-10-06 to address the maintainer's second
        review of PR #11: src/status-view.js restructured into small,
        descriptively named functions and variables, with comments on the
        scroll measurements, and unseen entries counted against the number
        of entries at the viewer's last visit to the bottom instead of a
        running total, at the maintainer's request (148/148 tests passing).
      tools_used: [Claude Code]
      notes: pending maintainer review before merge.

declaration:
  date: "2026-10-06"
  declared_by: Erik Tjong Kim Sang
  contact: erikt@xs4all.nl
  notes: >-
    2026-09-17 initial declaration, covering the progress.js recorder/renderer
    module and its tests (plan step 2 of docs/visualize_progress_plan.md
    section 8). 2026-09-25 update, covering the agent's revisions in
    response to the maintainer's review of PR #7, and the status tab (plan
    step 3). 2026-09-26 update, covering the agent's revisions in response
    to the maintainer's review of PR #8, the capture/download recording
    (plan step 4) and its PR #9 review revisions, and the page-load and
    link-search recording (plan step 5). 2026-09-27 update, covering the
    PR #10 review revisions and the status tab polish and documentation
    (plan step 6). 2026-09-28 update, covering the PENDING placeholder
    status, the module.exports guards and the PR #11 review revisions.
    2026-10-06 update, covering the second PR #11 review revisions.
