<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Default extension: status</title>
    <style>
      html, body { height: 100%; }
      body { font-family: sans-serif; font-size: 13px; margin: 0; display: flex; flex-direction: column; }
      /* Two equal halves, each with a fixed heading above its own scrolling area. */
      .pane { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      .pane + .pane { border-top: 1px solid #ccc; }
      .scroll-box { flex: 1; min-height: 0; position: relative; display: flex; }
      .scroll { flex: 1; min-width: 0; overflow: auto; }
      /* Shadow under the heading while the content is scrolled down (see status-view.js). */
      .scroll-box.scrolled::before {
        content: ""; position: absolute; top: 0; left: 0; right: 0; height: 8px; z-index: 2;
        background: linear-gradient(rgba(0, 0, 0, 0.25), transparent); pointer-events: none;
      }
      .new-entries-button {
        position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); z-index: 2;
        padding: 4px 12px; border: 1px solid #999; border-radius: 12px; background: #fff;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3); cursor: pointer; font-size: 12px;
      }
      .new-entries-button[hidden] { display: none; }
      h2 { font-size: 15px; margin: 10px 8px 6px; }
      .count { font-weight: normal; color: #555; }
      table { border-collapse: collapse; width: 100%; }
      th, td {
        border: 1px solid #ccc; vertical-align: top; text-align: left;
        min-width: 160px; overflow-wrap: anywhere;
      }
      th { padding: 4px 8px; background: #f0f0f0; position: sticky; top: 0; white-space: nowrap; }
      td { padding: 4px 8px; }
      .status-success { background: #e6f4ea; }
      .status-failed { background: #fdecea; }
      .status-skipped { background: #eeeeee; }
      .status-pending { background: #e8f0fe; }
      #log { font-family: monospace; font-size: 12px; padding: 0 8px 8px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <section class="pane">
      <h2>Progress <span class="count" id="progress-count"></span></h2>
      <div class="scroll-box">
        <div class="scroll" id="progress"></div>
        <button class="new-entries-button" id="progress-new" hidden></button>
      </div>
    </section>

    <section class="pane">
      <h2>Log <span class="count" id="log-count"></span></h2>
      <div class="scroll-box">
        <div class="scroll" id="log"></div>
        <button class="new-entries-button" id="log-new" hidden></button>
      </div>
    </section>

    <script src="src/status-view.js"></script>
    <script src="src/assisted-check-view.js"></script>
  </body>
</html>
