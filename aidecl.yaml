schema_version: "1.0.0"

project:
  name: browser-plugins
  repository: https://github.com/escience-tmsr/browser-plugins
  license: Apache-2.0
  content_type: software

ai_usage:
  used: true
  level: moderate
  summary: >-
    An autonomous coding agent (Claude Code) implemented the progress-recorder
    and HTML-table-renderer module for the default browser extension's planned
    live progress/status view, plus its unit test suite, following a
    design plan (docs/visualize_progress_plan.md) that the agent wrote in
    cooperation with the maintainer, and adapted
    from the row-grain design sketched there and the doi_downloader Python
    project's progress.py as a reference implementation. All output is
    intended for human review before merge.

  tools:
    - name: Claude Code
      vendor: Anthropic
      type: agent
      model: claude-sonnet-5
      hosting: cloud_vendor
      trains_on_data: false
      period: { start: "2026-09-17", end: "2026-09-17" }
      purpose: [code generation, test writing]
    - name: Claude Code
      vendor: Anthropic
      type: agent
      model: claude-opus-5-5
      hosting: cloud_vendor
      trains_on_data: false
      period: { start: "2026-09-25", end: "2026-09-25" }
      purpose: [code revision, documentation]
    - name: rseng-agent-skills
      type: standalone
      version: "0.1.0"
      skills_consulted: [rseng-quality-framework, rseng-ai-declaration, rseng-testing]

  activities: [code_generation, testing, documentation]

  scope:
    code_generation: true
    code_review: false
    documentation: true
    testing: true
    infrastructure: false

  code_proportion:
    ai_generated_percent: 100
    ai_assisted_percent: 0
    human_only_percent: 0
    method: self_reported
    estimation_notes: >-
      Applies only to the two new files this session added
      (default/src/progress.js, default/tests/progress.test.js) and the
      one-line devDependency fix in default/package.json, and to the
      review-driven revisions of those files and of
      docs/visualize_progress_plan.md; not the whole repo.

  components:
    - name: progress recorder/renderer (default/src/progress.js)
      description: >-
        Per-(doi, page) progress-tracking recorder and HTML table renderer for
        the extension's planned status tab; row grain is one row per page
        visited within a job, keyed by `${doi}#${pageCounter}`.
      ai_involvement: >-
        Generated by the agent on 2026-09-17 from the maintainer's written
        plan (docs/visualize_progress_plan.md, section 7 sketch) and adapted
        from doi_downloader/progress.py (../doi-downloader,
        visualize_progress branch) as a structural reference. Revised by the
        agent on 2026-09-25 to address the maintainer's review of PR #7
        (column names, argument and function renames).
      tools_used: [Claude Code]
      notes: human-reviewed by the maintainer in PR #7.
    - name: progress recorder tests (default/tests/progress.test.js)
      description: unit tests for the recorder/renderer module above.
      ai_involvement: >-
        Agent-written alongside the module on 2026-09-17, run locally with
        `npm test` (70/70 passing including the pre-existing suites).
        Revised by the agent on 2026-09-25 to address the maintainer's review
        of PR #7 (test values moved into named constants).
      tools_used: [Claude Code]
      notes: human-reviewed by the maintainer in PR #7.

declaration:
  date: "2026-09-25"
  declared_by: Erik Tjong Kim Sang
  contact: erikt@xs4all.nl
  notes: >-
    2026-09-17 initial declaration, covering the progress.js recorder/renderer
    module and its tests (plan step 2 of docs/visualize_progress_plan.md
    section 8). 2026-09-25 update, covering the agent's revisions in
    response to the maintainer's review of PR #7.
